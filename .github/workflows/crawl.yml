name: Crawl Snooker Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx selectolax

      - name: Run crawler
        run: python crawler/main.py

      - name: Commit updated data
        run: |
          git config user.name "snooker-bot"
          git config user.email "snooker-bot@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "data: auto update"
            git push
          else
            echo "No changes"
          fi
